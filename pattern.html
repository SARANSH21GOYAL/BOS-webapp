<!DOCTYPE html>
<html>
<head>
  <title>BOS Background Pattern</title>
  <style>
    body {
      background: white;
      margin: 0;
      padding: 0;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="patternCanvas"></canvas>
  <script>
    let canvas = document.getElementById('patternCanvas');
    let ctx = canvas.getContext('2d');

    // A4 size at 96 DPI
    canvas.width = 794;
    canvas.height = 1123;

    // White background
    ctx.fillStyle = 'white';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Random dense dots
    ctx.fillStyle = 'black';
    
    // 2000 random dots — dense aur random
    for (let i = 0; i < 2000; i++) {
      let x = Math.random() * canvas.width;
      let y = Math.random() * canvas.height;
      let size = Math.random() * 3 + 1; // 1-4px random size
      
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fill();
    }
  </script>
</body>
</html>
