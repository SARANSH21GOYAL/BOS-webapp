<!DOCTYPE html>
<html>
<head>
  <title>BOS Background Pattern</title>
  <style>
    body { background: white; margin: 0; padding: 0; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="patternCanvas"></canvas>
  <script>
    let canvas = document.getElementById('patternCanvas');
    let ctx = canvas.getContext('2d');

    canvas.width = 794;
    canvas.height = 1123;

    // Get all pixels at once
    let imageData = ctx.createImageData(canvas.width, canvas.height);
    let data = imageData.data;

    // Set each pixel randomly black or white
    for (let i = 0; i < data.length; i += 4) {
      let value = Math.random() > 0.3 ? 0 : 255; // Random black or white
      data[i] = value;     // R
      data[i+1] = value;   // G
      data[i+2] = value;   // B
      data[i+3] = 255;     // Alpha
    }

    // Draw all pixels at once — one operation!
    ctx.putImageData(imageData, 0, 0);
  </script>
</body>
</html>
