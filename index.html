<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOS WEB App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => { reg.update(); console.log("Offline ready!") })
      .catch(err => console.log("SW Error: " + err));
  }
</script>
</head>
<body>
    <h1>WEB BOS</h1>
    <p id="fps">FPS: 0</p>
    <button id="captureBtn">Capture Reference Frame</button>
    <button id="viewToggleBtn">🔄 Show Original Feed</button>
    <select id="algorithmSelect">
      <option value="opticalflow" selected>🌀 Optical Flow</option>
      <option value="cfs">➖ CFS (Frame Subtraction)</option>
    </select>
    <select id="colorModeSelect">
      <option value="hsv" selected>🌈 Colored (HSV Direction)</option>
      <option value="grayscale">⚫ Grayscale</option>
      <option value="viridis">🟢 Viridis</option>
      <option value="magma">🔥 Magma</option>
      <option value="inferno">🌋 Inferno</option>
    </select>
    <label id="histEqLabel"><input type="checkbox" id="histEqCheckbox"> Histogram Equalization</label>
    <button id="pauseBtn">⏸️ Pause Feed</button>
    <button id="switchBtn">📷 Switch to Back Camera</button>
    <button id="flashBtn">🔦 Flash OFF</button>
    <div id="controls">
      <div class="slider-group">
        <label>Contrast Strength: <span id="contrastVal">3</span></label>
        <input type="range" id="contrastSlider" min="1" max="6" value="3" step="0.5">
      </div>
      <div class="slider-group">
        <label>Gamma: <span id="gammaVal">1.0</span></label>
        <input type="range" id="gammaSlider" min="0.1" max="3" value="1" step="0.05">
      </div>
      <div class="slider-group">
        <label>Levels: <span id="levelsVal">3</span></label>
        <input type="range" id="levelsSlider" min="1" max="5" value="3">
      </div>
      <div class="slider-group">
        <label>Window Size: <span id="windowVal">15</span></label>
        <input type="range" id="windowSlider" min="5" max="25" value="15" step="2">
      </div>
      <div class="slider-group">
        <label>Resolution: <span id="resVal">640x480</span></label>
        <select id="resSelect">
          <option value="1280x720">1280x720 (HD)</option>
          <option value="640x480" selected>640x480 (Default)</option>
          <option value="320x240">320x240 (Fast)</option>
          <option value="160x120">160x120 (Fastest)</option>
        </select>
      </div>
    </div>

    <!-- Upload Section -->
    <div id="uploadSection">
      <h3>Upload Images</h3>
      <div class="upload-group">
        <label>Reference Image:</label>
        <input type="file" id="refImage" accept="image/*">
      </div>
      <div class="upload-group">
        <label>Flow Image:</label>
        <input type="file" id="flowImage" accept="image/*">
      </div>
      <button id="processBtn">Calculate Optical Flow</button>
      <button id="downloadBtn" style="display:none">Download Result ⬇️</button>
      <button id="exportReportUploadBtn" style="display:none">Export Report 📄</button>
      <button id="exportJsonUploadBtn" style="display:none">Export JSON 📋</button>
      <button id="resumeBtn" style="display:none">▶️ Resume Live Feed</button>
    </div>

    <!-- Burst Section -->
    <div id="burstSection">
      <h3>Burst Capture</h3>
      <button id="burstBtn">📸 Capture Burst</button>
      <div id="burstDownloads" style="display:none">
        <button id="downloadImg1">Download Image 1 ⬇️</button>
        <button id="downloadImg2">Download Image 2 ⬇️</button>
        <button id="downloadFlow">Download Flow Result ⬇️</button>
        <button id="exportReportBurstBtn" style="display:none">Export Report 📄</button>
        <button id="exportJsonBurstBtn" style="display:none">Export JSON 📋</button>
        <button id="resumeBurstBtn" style="display:none">▶️ Resume Live Feed</button>

      </div>
    </div>

    <!-- Record Section -->
    <div id="recordSection">
      <h3>Record Flow Video</h3>
      <p id="recordWarning">⚠️ Best at low resolution (320x240 or less)</p>
      <p id="recordTimer">00:00</p>
      <button id="recordBtn">🔴 Start Recording</button>
      <button id="downloadRecordBtn" style="display:none">Download Video ⬇️</button>
    </div>

    <canvas id="output" width="640" height="480"></canvas>
    <video id="webcam" width="640" height="480" autoplay style="display:none"></video>
    <script src="app.js"></script>
    <script src="opencv.js" onload="onOpenCvReady()" type="text/javascript"></script>
</body>
</html>
